  <body>
    <!-- Cinematic film ground: fixed behind every page, and deliberately
         outside #root so it survives client-side route changes. Sources are
         set by the rotator below; two layers so clips can crossfade. -->
    <div id="ef-film" aria-hidden="true">
      <video class="ef-layer is-on" loop muted playsinline preload="auto"
             disablepictureinpicture disableremoteplayback
             poster="https://assets.mixkit.co/videos/42342/42342-thumb-720-0.jpg"></video>
      <video class="ef-layer" loop muted playsinline preload="none"
             disablepictureinpicture disableremoteplayback></video>
    </div>
    <div id="ef-film-scrim" aria-hidden="true"></div>
    <div id="root"></div>
    <script>
      (function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        function scrollToEl(el) {
          var target = Math.max(0, el.getBoundingClientRect().top + window.scrollY - 24);
          if (reduce) { window.scrollTo(0, target); return; }
          var start = window.scrollY, delta = target - start, t0 = performance.now(), ms = 620;
          (function step(now) {
            var p = Math.min(1, (now - t0) / ms);
            window.scrollTo(0, start + delta * (1 - Math.pow(1 - p, 3)));
            if (p < 1) requestAnimationFrame(step);
          })(t0);
          setTimeout(function () {
            if (Math.abs(window.scrollY - target) > 2) window.scrollTo(0, target);
          }, ms + 120);
        }
        document.addEventListener("click", function (e) {
          var a = e.target.closest && e.target.closest('a[href^="#"]');
          if (!a) return;
          var id = a.getAttribute("href").slice(1);
          if (!id) return;
          var el = document.getElementById(id);
          if (!el) return;
          e.preventDefault();
          scrollToEl(el);
          history.replaceState(null, "", "#" + id);
        });
      })();
    </script>
    <script>
      // The film ground: a slow rotation through power and compute plates,
      // crossfaded. Alternating the two is the whole EdgeFlex thesis, so the
      // background carries it rather than just looking cinematic.
      (function () {
        var FILM = [
          "42342", // downtown Austin from the air at dusk: the metro side
          "49835", // downtown Austin power plant under the towers: power inside the metro
          "4234",  // offshore wind farm out at sea
          "48353", // pumpjacks working an oil field
          "17024", // molten metal and steam in a furnace
          "25119", // flying through a heavy industrial landscape
          "30219"  // transmission poles and towers, low view
        ];
        var HOLD = 13000, FADE = 1600;
        var box = document.getElementById("ef-film");
        if (!box) return;
        var layers = box.querySelectorAll("video");
        if (layers.length < 2) return;

        function url(id) { return "https://assets.mixkit.co/videos/" + id + "/" + id + "-720.mp4"; }
        function start(v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }

        var i = 0, front = 0, timer = 0;
        layers[0].src = url(FILM[0]);
        start(layers[0]);

        // Anything that quietly stops the front layer (tab throttling, a
        // stalled segment) gets picked back up by the sweep below.
        window.__efFilmFront = function () { return layers[front]; };

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        function advance() {
          var back = layers[1 - front], swapped = false;
          i = (i + 1) % FILM.length;
          back.src = url(FILM[i]);
          back.load();
          function swap() {
            if (swapped) return;
            swapped = true;
            back.removeEventListener("canplay", swap);
            start(back);
            back.classList.add("is-on");
            var old = layers[front];
            old.classList.remove("is-on");
            setTimeout(function () { old.pause(); }, FADE + 120);
            front = 1 - front;
            timer = setTimeout(advance, HOLD);
          }
          back.addEventListener("canplay", swap);
          setTimeout(swap, 6000); // never stall the rotation on a slow clip
        }
        timer = setTimeout(advance, HOLD);

        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            clearTimeout(timer);
            layers[0].pause(); layers[1].pause();
          } else {
            start(layers[front]);
            clearTimeout(timer);
            timer = setTimeout(advance, HOLD);
          }
        });
      })();

      // The page ground is the only film now. Every other <video> the bundle
      // still renders belongs to a retired section and is hidden in CSS, so
      // strip it the moment React inserts it -- otherwise the browser still
      // pulls a poster and metadata for five clips nobody will ever see.
      (function () {
        function strip() {
          var vids = document.querySelectorAll("video");
          for (var i = 0; i < vids.length; i++) {
            var v = vids[i];
            if (v.closest("#ef-film")) continue;
            var s = v.querySelector("source");
            if (s) s.remove();
            if (v.getAttribute("src") || v.getAttribute("poster") || s) {
              v.removeAttribute("src");
              v.removeAttribute("poster");
              v.removeAttribute("autoplay");
              try { v.pause(); v.load(); } catch (e) {}
            }
          }
        }
        strip();
        new MutationObserver(strip).observe(document.documentElement, { childList: true, subtree: true });

        // Keep the visible film layer alive if the tab throttles it off.
        function heal() {
          if (document.hidden) return;
          var layers = document.querySelectorAll("#ef-film video");
          for (var i = 0; i < layers.length; i++) {
            var v = layers[i];
            if (v.classList.contains("is-on") && v.paused && v.src) {
              var q = v.play(); if (q && q.catch) q.catch(function () {});
            }
          }
        }
        addEventListener("visibilitychange", heal);
        setInterval(heal, 4000);
        heal();
      })();
    </script>
  </body>
